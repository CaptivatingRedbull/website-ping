# One row per URL over the last 24 hours: latest response code (or "Connection
# failed" / "Connection timed out"), latest and average response time, the
# response time range and a sparkline, and whether the thresholds were exceeded.
[website_availability_overview]
description = Provides an overview of Website Monitoring results
enableSched = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = sourcetype="web_ping" `website_monitoring_search_index` | eval response_code=if(isnull(response_code) OR response_code=="", "Connection failed", response_code) | eval response_code=if(timed_out == "True", "Connection timed out", response_code) | stats sparkline(avg(total_time)) as sparkline_response_time avg(total_time) as avg_response_time max(total_time) as max_response_time latest(response_code) as response_code latest(_time) as last_checked latest(title) as title latest(total_time) as response_time range(total_time) as range min(total_time) as min by url | eval time_exceeded=if(response_time>`response_time_threshold`,1,0) | eval avg_time_exceeded=if(avg_response_time>`response_time_threshold`,1,0) | eval response_time=round(response_time, 2)." ms" | eval average=round(avg_response_time, 2)." ms" | eval maximum=round(max_response_time, 2)." ms" | eval range=round(min, 0)." - ".round(min+range, 0)." ms" | table title url response_code last_checked time_exceeded response_time avg_time_exceeded average range sparkline_response_time  | `timesince(last_checked,last_checked)`

# Sites with an error status, a timeout, no response or a slow response over
# the last 24 hours, one row per site and outcome.
[website_performance_problems]
description = [Deprecated] This search triggers when websites meet the criteria of a performance problem (too slow or not returning the expected response code). This search is deprecated. It is recommended that you use the search "Website Performance Problem" instead.
enableSched = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = sourcetype="web_ping" `website_monitoring_search_index` (response_code>=400 OR timed_out=True OR total_time>`response_time_threshold` OR response_code="") | eval response_code=if(isnull(response_code) OR response_code=="", "Connection failed", response_code) | eval response_code=if(timed_out == "True", "Connection timed out", response_code) | stats count as count max(total_time) as max_total_time by title url response_code | eval max_total_time=round(max_total_time, 2)." ms"

# Number of sites whose latest check failed: an error status, a timeout, or no
# response at all (empty response_code). Range "low" when none, else "severe".
[inoperable_sites_rangemap]
description = Indicates the number of sites that are currently inoperable (not operating correctly)
enableSched = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = sourcetype="web_ping" `website_monitoring_search_index` | stats latest(title) as title latest(response_code) as response_code latest(timed_out) as timed_out distinct_count(url) as count by url | eval down=if(response_code>=400 OR timed_out=="True" OR isnull(response_code) OR response_code=="", 1, 0) | stats sum(down) as count | rangemap field=count low=0-0 default=severe

# Number of sites whose latest response took longer than response_time_threshold.
# Checks without a response have no response time and are counted by
# inoperable_sites_rangemap instead.
[slow_sites_rangemap]
description = Indicates the number of sites that are currently running slowly (over the response time threshold)
enableSched = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = sourcetype="web_ping" `website_monitoring_search_index` | stats latest(title) as title latest(total_time) as response_time distinct_count(url) as count by url | eval time_exceeeded=if(response_time>`response_time_threshold`,1,0) | stats sum(time_exceeeded) as count | rangemap field=count low=0-0 default=severe

# Number of sites whose average response time over 24 hours is above
# response_time_threshold; only checks with a response count.
[slow_sites_avg_rangemap]
description = Indicates the number of sites that are currently running slowly (over the response time threshold) based on the average response time
enableSched = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = sourcetype="web_ping" `website_monitoring_search_index` | stats latest(title) as title avg(total_time) as response_time distinct_count(url) as count by url | eval time_exceeeded=if(response_time>`response_time_threshold`,1,0) | stats sum(time_exceeeded) as count | rangemap field=count low=0-0 default=severe

# Every 5 minutes: one row per site and outcome in the last 5 minutes for
# failure codes, timeouts, missing responses, slow responses and content that
# did not contain the expected string. The description column reads
# "503 (Service Unavailable)", "Connection failed", "Connection timed out" or
# "Content doesn't match"; timed_out is carried through stats so that a timeout
# is not reported as a plain connection failure. Sites tagged
# exclude_from_alerts (eventtype filter_website_monitoring_alerts) are skipped.
[Website Performance Problem]
description = This search triggers when websites meet the criteria of a performance problem (too slow or not returning the expected response code). Edit the macros response_codes_to_alert_on and response_time_threshold to change what is considered a failure.
alert.suppress = 1
alert.suppress.period = 60m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = 0
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = website_ping
request.ui_dispatch_view = search
search = sourcetype="web_ping" `website_monitoring_search_index` tag!="exclude_from_alerts" (`response_codes_to_alert_on` OR timed_out=True OR total_time>`response_time_threshold` OR response_code="" OR has_expected_string="false") \
| fillnull value="" has_expected_string \
| stats count as count max(total_time) as max_total_time max(eval(if(timed_out=="True",1,0))) as timed_out by title url response_code has_expected_string \
| lookup http_response_codes.csv response_code OUTPUT description \
| eval description=response_code." (".description.")" \
| eval description=if(response_code == "", "Connection failed", description) \
| eval description=if(timed_out == 1, "Connection timed out", description) \
| eval description=if(has_expected_string == "false", "Content doesn't match", description) \
| eval max_total_time=round(max_total_time, 2)." ms" \
| fields - has_expected_string timed_out

# Every 10 minutes: hosts whose website-ping runner wrote a heartbeat line to
# website_ping.log within the last 24 hours but not within the last 10 minutes.
# The runner logs a heartbeat every minute while it runs, so a row means its
# process stopped or hangs and no checks run on that host. A host stays listed
# until its last heartbeat is 24 hours old.
[Website Ping Runner Silent]
description = Triggers for each host whose website-ping runner wrote no heartbeat in the last 10 minutes after writing one in the last 24 hours: its checks have stopped, or the host no longer runs website-ping. Look at website_ping.log on that host; restarting Splunk there starts the runner again.
alert.track = 1
counttype = number of events
cron_schedule = */10 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = website_ping
request.ui_dispatch_view = search
search = index=_internal source=*website_ping.log* heartbeat earliest=-24h \
| stats latest(_time) as last_heartbeat by host \
| where last_heartbeat < relative_time(now(), "-10m") \
| convert ctime(last_heartbeat)
