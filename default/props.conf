# Events of the web_ping input are written as unbroken XML events, and Splunk
# reads a date from the text of such events even when the input sets <time>.
# A page title or body that contains a date would then move the event time.
# DATETIME_CONFIG = NONE makes Splunk use the time the input writes: the end of
# the check. Line breaking and search-time extraction are not affected.
[web_ping]
DATETIME_CONFIG = NONE
# The same for the body events of inputs with return_body: a date in the first
# lines of a page would otherwise set their time. A multi-line body stays one
# event.
[web_ping:response]
DATETIME_CONFIG = NONE
# The input's own log file. Splunk already indexes $SPLUNK_HOME/var/log/splunk
# into _internal; this gives the file and its rotated copies one sourcetype.
[source::...website_ping.log*]
sourcetype = website_ping:log
# Search-time fields of the log lines, which look like
#   2026-11-20 13:07:46,564 +0100 WARN stanza=web_ping://x v=1.0.0 message
# level (DEBUG, INFO, WARN, ERROR), stanza (the input, or "(process)" for lines
# about the whole runner), version and message. A stanza name with a space or a
# quote is written in quotes with \ and " escaped; stanza holds it unescaped.
# Automatic key=value extraction is off because it reads the free-text message
# as key=value pairs too.
[website_ping:log]
KV_MODE = none
EXTRACT-line = ^\S+ \S+ [+-]\d{4} (?<level>[A-Z]+) (?:stanza=(?:"(?<stanza_quoted>(?:[^"\\]|\\.)*)"|(?<stanza_plain>\S+)) )?v=(?<version>\S+) (?<message>.*)$
EVAL-stanza = coalesce(stanza_plain, replace(stanza_quoted, "\\\\(.)", "\1"), "(process)")
