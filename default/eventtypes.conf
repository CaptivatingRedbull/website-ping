# Events of this eventtype are tagged exclude_from_alerts (tags.conf), and the
# alert "Website Performance Problem" skips them. Set the search in
# local/eventtypes.conf to the sites that must not raise alerts, for example
# search = title=localhost
# The placeholder matches no event, so by default nothing is excluded.
[filter_website_monitoring_alerts]
search = FILL_THIS_SEARCH_IN
