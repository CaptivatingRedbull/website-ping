# Response time in milliseconds above which a check counts as slow (Failed in
# set_status, a problem for the alert "Website Performance Problem").
[response_time_threshold]
definition = 1000

# Response time in milliseconds above which set_status reports Warning.
[response_time_threshold_warning]
definition = 800

# Writes how long ago the epoch time in sourceField was into destField, as text
# ("just now", "5 minutes ago", "3 days ago").
[timesince(2)]
args = sourceField,destField
definition = eval now=time() | eval $destField$ = case( $sourceField$ > now, "0 minutes ago", now-$sourceField$ > (2*86400), round((now-$sourceField$) / (86400)) . " days ago", now-$sourceField$ > (2*3600), round((now-$sourceField$) / (3600)) . " hours ago", now-$sourceField$ > (2*60), round((now-$sourceField$) / (60)) . " minutes ago", now-$sourceField$ > 60, "1 minute ago", now-$sourceField$ <= 60, "just now" ) | fields - now
iseval = 0

# Writes the time between two epoch fields into destField, as text ("< a
# minute", "12 minutes", "2 days").
[duration(3)]
args = startField,endField,destField
definition = eval $destField$ = case( $startField$ > $endField$, "0 minutes", $endField$-$startField$ > (2*86400), round(($endField$-$startField$) / (86400)) . " days", $endField$-$startField$ > (2*3600), round(($endField$-$startField$) / (3600)) . " hours", $endField$-$startField$ > (2*60), round(($endField$-$startField$) / (60)) . " minutes", $endField$-$startField$ > 60, "1 minute", $endField$-$startField$ <= 60, "< a minute" )
iseval = 0

# The format_events macros turn check events into a readable table: time as
# text, response_time in milliseconds, and response_code "Connection failed"
# when no response arrived (the field is empty, not missing) or "Connection
# timed out" when the check timed out.

# Columns: time, response_code, response_time.
[format_events]
definition = eval time=_time | eval response_time=total_time | convert ctime(time) | eval response_code=if(isnull(response_code) OR response_code=="", "Connection failed", response_code) | eval response_code=if(timed_out == "True", "Connection timed out", response_code) | fields - _raw _time | fields time response_code response_time

# All fields of the event, including _raw.
[format_events_raw]
definition = eval time=_time | eval response_time=total_time | convert ctime(time) | eval response_code=if(isnull(response_code) OR response_code=="", "Connection failed", response_code) | eval response_code=if(timed_out == "True", "Connection timed out", response_code)

# Columns: time, title, url, response_code, response_time.
[format_events_ex]
definition = eval time=_time | eval response_time=total_time | convert ctime(time) | eval response_code=if(isnull(response_code) OR response_code=="", "Connection failed", response_code) | eval response_code=if(timed_out == "True", "Connection timed out", response_code) | fields - _raw _time | fields time title url response_code response_time

# Search filter for checks that failed: an error status, a timeout, or no
# response at all (empty response_code).
[filter_inoperable]
definition = (response_code>=400 OR timed_out="True" OR NOT response_code="*" OR response_code="")

# Kept so that searches written as "... `filter_disabled` | ..." still run. It
# passes every result through: disabled inputs write no events, so there is
# nothing to remove.
[filter_disabled]
definition = | search *

# Response codes that count as a failure.
[response_codes_to_alert_on]
definition = response_code>=400

# Search filter for checks that need attention, on raw events or after
# set_response_code: failure codes, slow responses, no response, a timeout, or
# content that did not contain the expected string.
[filter_response_codes_and_response_times]
definition = `response_codes_to_alert_on` OR response_time>=`response_time_threshold` OR response_code="*false" OR response_code="Connection failed" OR response_code="Connection timed out" OR timed_out=True OR response_code="" OR has_expected_string="false"

# Index or indexes that every shipped search reads. "()" searches the role's
# default indexes; to name the index the inputs write to, set for example
# definition = index=main
# in local/macros.conf.
[website_monitoring_search_index]
definition = ()

# Replaces response_code with "Connection timed out" or "Connection failed"
# when no response arrived, and appends has_expected_string ("200 false") when
# the input checks the content.
[set_response_code]
definition = eval response_code=case(timed_out == "True", "Connection timed out", isnull(response_code) OR response_code="", "Connection failed", true(), response_code).coalesce(" ".has_expected_string,"")
iseval = 0

# Writes status Failed, Warning or OK. Thresholds come from the event's
# error_threshold and warning_threshold, which inputs with their own limits
# write into every event, otherwise from the two threshold macros. Meant to run
# after set_response_code.
[set_status]
definition = eval error_threshold=coalesce(error_threshold,`response_time_threshold`), warning_threshold=coalesce(warning_threshold,`response_time_threshold_warning`), status = case(`response_codes_to_alert_on` OR total_time>=error_threshold OR response_code="*false" OR response_code="Connection failed" OR response_code="Connection timed out" OR timed_out=True OR response_code="" OR has_expected_string="false", "Failed", total_time>=warning_threshold, "Warning", true(), "OK")
iseval = 0
