[tool.pytest.ini_options]
pythonpath = ["bin", "tests/integration"]
testpaths = ["tests"]
markers = [
    "single: single-instance install and event tests against Splunk in Docker",
    "network: network failure scenarios against Splunk in Docker",
    "no_route: the no-direct-route scenario on an internal-only network",
    "distributed: deployment and event path tests on the distributed stack",
    "release: checks required only for a release",
    "spike: throwaway probes only run when -m names spike",
    "golden: capture Website Monitoring 2.9.7 events; only run when -m names golden",
]

[tool.coverage.run]
source = ["bin"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pyright]
extraPaths = ["bin", "tests/integration"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py39"
