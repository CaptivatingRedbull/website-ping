[tool.pytest.ini_options]
pythonpath = ["bin"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["bin"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pyright]
extraPaths = ["bin"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py39"
