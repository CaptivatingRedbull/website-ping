# Single instance and target on one internal-only network, with no route out.
# The target serves only the probe's controls; the stanza checks 192.0.2.10.
# A published port is dropped on such a network, so results are read with exec.

x-labels: &labels
  website-ping.test: "true"
  website-ping.kept: "${WPTEST_KEPT:-false}"

services:
  so1:
    image: ${WPTEST_SPLUNK_IMAGE:?}
    hostname: so1
    environment:
      SPLUNK_START_ARGS: ${SPLUNK_START_ARGS:?Splunk licence not accepted}
      SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS:?Splunk General Terms not accepted}
      SPLUNK_PASSWORD: ${WPTEST_PASSWORD:?}
    labels: *labels
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    volumes:
      - so1-etc:/opt/splunk/etc
      - so1-var:/opt/splunk/var

  target:
    image: python:3.13.18-slim
    hostname: target
    command: ["sh", "-c", "until [ -f /srv/go ]; do sleep 1; done; exec python -u /srv/server.py"]
    labels: *labels
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5

networks:
  default:
    internal: true
    labels: *labels

volumes:
  so1-etc:
    labels: *labels
  so1-var:
    labels: *labels
