# Heavy forwarder, indexer, search head and deployment server, plus the target.
# Variables come from the env file written by wptest/stack.py.

x-labels: &labels
  website-ping.test: "true"
  website-ping.kept: "${WPTEST_KEPT:-false}"

x-splunk-env: &splunk-env
  SPLUNK_START_ARGS: ${SPLUNK_START_ARGS:?Splunk licence not accepted}
  SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS:?Splunk General Terms not accepted}
  SPLUNK_PASSWORD: ${WPTEST_PASSWORD:?}
  SPLUNK_INDEXER_URL: idx
  SPLUNK_SEARCH_HEAD_URL: sh
  SPLUNK_HEAVY_FORWARDER_URL: hf

services:
  ds:
    image: ${WPTEST_SPLUNK_IMAGE:?}
    hostname: ds
    environment:
      <<: *splunk-env
      SPLUNK_ROLE: splunk_deployment_server
    labels: *labels
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    volumes:
      - ds-etc:/opt/splunk/etc
      - ds-var:/opt/splunk/var

  idx:
    image: ${WPTEST_SPLUNK_IMAGE:?}
    hostname: idx
    environment:
      <<: *splunk-env
      SPLUNK_ROLE: splunk_indexer
    labels: *labels
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    ports:
      - "127.0.0.1::8089"
    volumes:
      - idx-etc:/opt/splunk/etc
      - idx-var:/opt/splunk/var

  sh:
    image: ${WPTEST_SPLUNK_IMAGE:?}
    hostname: sh
    environment:
      <<: *splunk-env
      SPLUNK_ROLE: splunk_search_head
    labels: *labels
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1::8089"
    volumes:
      - sh-etc:/opt/splunk/etc
      - sh-var:/opt/splunk/var

  hf:
    image: ${WPTEST_SPLUNK_IMAGE:?}
    hostname: hf
    environment:
      <<: *splunk-env
      SPLUNK_ROLE: splunk_heavy_forwarder
      SPLUNK_DEPLOYMENT_SERVER: ds
    labels: *labels
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    volumes:
      - hf-etc:/opt/splunk/etc
      - hf-var:/opt/splunk/var

  target:
    image: python:3.13.18-slim
    hostname: target
    command: ["sh", "-c", "until [ -f /srv/go ]; do sleep 1; done; exec python -u /srv/server.py"]
    labels: *labels
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5

networks:
  default:
    labels: *labels

volumes:
  ds-etc:
    labels: *labels
  ds-var:
    labels: *labels
  idx-etc:
    labels: *labels
  idx-var:
    labels: *labels
  sh-etc:
    labels: *labels
  sh-var:
    labels: *labels
  hf-etc:
    labels: *labels
  hf-var:
    labels: *labels
