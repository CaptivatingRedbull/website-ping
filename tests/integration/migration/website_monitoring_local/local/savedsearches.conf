# The shipped alert, run every minute and without suppression, with the
# built-in Log Event action, which writes one event to main per run that
# triggers.
[Website Performance Problem]
cron_schedule = * * * * *
alert.suppress = 0
action.logevent = 1
action.logevent.param.event = wptest-alert name="$name$" results=$job.resultCount$
action.logevent.param.index = main
action.logevent.param.sourcetype = wptest:alert
action.logevent.param.source = alert:$name$

# A search an admin wrote with the app's macros: every failed check of the last
# day as a table.
[Failed checks today]
description = Failed checks of the last 24 hours
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
search = sourcetype="web_ping" `website_monitoring_search_index` `filter_inoperable` | `format_events_ex`