# Test proxy for the website-ping harness. It runs only on the test network.
# 3128 is open. 3129 requires Basic proxy auth: user wpproxy, password
# wpproxy-secret (APR1 hash in /etc/squid/passwd).
http_port 3128
http_port 3129
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic children 2
auth_param basic realm wptest-proxy
acl auth_port localport 3129
acl authenticated proxy_auth REQUIRED
http_access deny auth_port !authenticated
http_access allow all
cache deny all
logformat wptest %ts.%03tu %>a port=%lp %Ss/%03>Hs %rm %ru user=%un ua="%{User-Agent}>h"
access_log daemon:/var/log/squid/access.log wptest
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
