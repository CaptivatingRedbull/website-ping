# Copied to etc/system/local/serverclass.conf on the deployment server, followed by
# splunk reload deploy-server. Sends both apps to the heavy forwarder only.

[global]

[serverClass:wptest]
whitelist.0 = hf
restartSplunkd = true
stateOnClient = enabled

[serverClass:wptest:app:website_ping]

[serverClass:wptest:app:website_ping_inputs]
