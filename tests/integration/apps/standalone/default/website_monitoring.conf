# [default] in another app than website_ping: the input reads it through
# website_ping's [wp_defaults], and the start line shows thread_limit=50.
[default]
thread_limit = 50

# Environment proxies off for the inputs that name this stanza.
[ignore-all]
proxy_ignore = *

# Refused: inputs that name this stanza do not run.
[socks]
proxy_server = squid
proxy_port = 1080
proxy_type = socks5