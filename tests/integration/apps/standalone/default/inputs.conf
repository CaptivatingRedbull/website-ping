# One stanza per row of the scenario table in docs/designs/website-ping-test-harness.md.
# Stanza name and title are the same. Unset settings come from website-ping's default/inputs.conf.

[web_ping://status-200]
title = status-200
url = http://target:8080/status/200
interval = 15

[web_ping://status-404]
title = status-404
url = http://target:8080/status/404
interval = 15

[web_ping://status-503]
title = status-503
url = http://target:8080/status/503
interval = 15

[web_ping://chain-at-3]
title = chain-at-3
url = http://target:8080/chain/chain-at-3/3
interval = 3600
max_redirects = 3

[web_ping://chain-at-10]
title = chain-at-10
url = http://target:8080/chain/chain-at-10/10
interval = 3600

[web_ping://chain-at-50]
title = chain-at-50
url = http://target:8080/chain/chain-at-50/50
interval = 3600
max_redirects = 50

[web_ping://repeat-8]
title = repeat-8
url = http://target:8080/repeat/repeat-8/8
interval = 3600
max_redirects = 10

[web_ping://redirect-301]
title = redirect-301
url = http://target:8080/redirect/301/redirect-301
interval = 3600

[web_ping://redirect-302]
title = redirect-302
url = http://target:8080/redirect/302/redirect-302
interval = 3600

[web_ping://redirect-303]
title = redirect-303
url = http://target:8080/redirect/303/redirect-303
interval = 3600

[web_ping://redirect-307]
title = redirect-307
url = http://target:8080/redirect/307/redirect-307
interval = 3600

[web_ping://redirect-308]
title = redirect-308
url = http://target:8080/redirect/308/redirect-308
interval = 3600

[web_ping://over-3]
title = over-3
url = http://target:8080/chain/over-3/4
interval = 3600
max_redirects = 3

[web_ping://over-10]
title = over-10
url = http://target:8080/chain/over-10/11
interval = 3600
max_redirects = 10

[web_ping://over-50]
title = over-50
url = http://target:8080/chain/over-50/51
interval = 3600
max_redirects = 50

[web_ping://loop]
title = loop
url = http://target:8080/loop/loop
interval = 3600
max_redirects = 10

[web_ping://redirects-off]
title = redirects-off
url = http://target:8080/redirect/302/redirects-off
interval = 3600
max_redirects = 0

[web_ping://refused]
title = refused
url = http://target:8090/
interval = 15

[web_ping://hang]
title = hang
url = http://target:8081/
interval = 15
timeout = 5

[web_ping://slow-body]
title = slow-body
url = http://target:8080/slow-body/slow-body
interval = 3600
timeout = 5

[web_ping://trickled-body]
title = trickled-body
url = http://target:8080/trickle/trickled-body
interval = 3600
timeout = 5

[web_ping://dns-failure]
title = dns-failure
url = http://wptest.invalid/
interval = 15

[web_ping://tls-valid]
title = tls-valid
url = https://target:8443/
interval = 15

[web_ping://tls-expired]
title = tls-expired
url = https://target:8444/
interval = 15

[web_ping://tls-self-signed]
title = tls-self-signed
url = https://target:8445/
interval = 15

[web_ping://tls-wrong-host]
title = tls-wrong-host
url = https://target:8446/
interval = 15

[web_ping://proxy-ignored]
title = proxy-ignored
url = http://target:8080/status/200
interval = 15
user_agent = wptest-proxy-ignored

# Only url and title set: every other setting is inherited.
[web_ping://default-settings]
title = default-settings
url = http://target:8080/status/200

# Invalid URL: must log an ERROR and write no event.
[web_ping://bad-config]
title = bad-config
url = not-a-url
